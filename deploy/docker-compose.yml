# Run from THIS folder:   cd deploy && cp docker.env.example docker.env   (edit it)   then   docker compose up -d --build
# Then open http://127.0.0.1:8000. See DOCKER.md for the first-account step, backups and updating.
# It lives in its own folder on purpose: docker compose reads a .env next to the compose file, and the repo's own .env
# (a developer's file, holding real keys) must never be read by, or break, a deployment.
services:
  app:
    build:
      context: ..                               # the repo root, where the Dockerfile is
      dockerfile: Dockerfile
      args:
        CODE_VERSION: ${CODE_VERSION:-unknown}      # export it first so runs record which version made them
    image: website-test-pipeline:latest
    restart: unless-stopped
    init: true                      # reaps the browser processes a run leaves behind
    shm_size: "1gb"                 # Chromium needs a real /dev/shm; the default 64 MB makes pages crash
    ports:
      - "127.0.0.1:8000:8000"       # only this machine; put a reverse proxy with HTTPS in front to share it (see DOCKER.md)
    env_file:
      - docker.env                  # your settings; deliberately not the repo's .env (which holds real keys)
    volumes:
      - wtp-data:/data              # the database, the saved-keys key file, and each run's scratch folder

volumes:
  wtp-data:
