[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-website-test-pipeline"
version = "0.1.0"
description = "Dynamic website exploration, smoke-test generation, evidence capture, and Word reporting"
requires-python = ">=3.10"
dependencies = ["playwright>=1.40", "python-docx>=1.1", "pytest>=8.0", "pytest-playwright>=0.5"]

[project.scripts]
website-tests = "website_test_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["website_test_pipeline*"]
